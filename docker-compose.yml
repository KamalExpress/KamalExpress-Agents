# ─────────────────────────────────────────────────────────────
# Kamal Express AI Platform — Portainer Production Stack
# ─────────────────────────────────────────────────────────────
# Deploy directly from Portainer:
#   Repository: https://github.com/KamalExpress/KamalExpress-Agents.git
#   Reference:  refs/heads/main
#   Path:       docker-compose.yml
# ─────────────────────────────────────────────────────────────
version: "3.8"

services:
  kamal-agents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kamal-express-agents
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # API Server
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - API_RELOAD=false
      
      # AI Provider (groq | sambanova | bitnet | openrouter | openai | anthropic)
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_DEFAULT_MODEL=${GROQ_DEFAULT_MODEL:-qwen/qwen3.8-27b}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - BITNET_SERVER_URL=${BITNET_SERVER_URL:-https://ai.alamiaconnect.com/v1}
      - BITNET_API_KEY=${BITNET_API_KEY:-51129693340}

      # Authentication & RBAC
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_DEFAULT_ADMIN_USERNAME=${AUTH_DEFAULT_ADMIN_USERNAME:-admin}
      - AUTH_DEFAULT_ADMIN_PASSWORD=${AUTH_DEFAULT_ADMIN_PASSWORD:-KamalAdmin2026!}
      - AUTH_DEFAULT_STAFF_USERNAME=${AUTH_DEFAULT_STAFF_USERNAME:-staff}
      - AUTH_DEFAULT_STAFF_PASSWORD=${AUTH_DEFAULT_STAFF_PASSWORD:-KamalStaff2026!}
      - AUTH_SESSION_EXPIRE_DAYS=${AUTH_SESSION_EXPIRE_DAYS:-7}
      - AUTH_WEBHOOK_SECRET=${AUTH_WEBHOOK_SECRET:-}

      # Captcha Solving
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-none}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY:-}

      # Browser Automation
      - BROWSER_MODE=local
      - BROWSER_HEADLESS=true
      - BROWSER_TIMEOUT_MS=30000

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - kamal_data:/app/data
      - browser_profiles:/app/browser_profiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kamal-net

volumes:
  kamal_data:
  browser_profiles:

networks:
  kamal-net:
    driver: bridge
