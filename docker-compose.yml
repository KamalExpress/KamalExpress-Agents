# ─────────────────────────────────────────────────────────────
# Kamal Express AI Platform — Portainer Production Stack
# ─────────────────────────────────────────────────────────────
# Deploy directly from Portainer:
#   Repository: https://github.com/KamalExpress/KamalExpress-Agents.git
#   Reference:  refs/heads/main
#   Path:       docker-compose.yml
# ─────────────────────────────────────────────────────────────
version: "3.8"

services:
  kamal-agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: kamalexpress-agents-api:latest
    container_name: kamal-express-agents
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      # API Server
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - API_RELOAD=false
      
      # AI Provider (cloudflare | groq | sambanova | openrouter | openai | anthropic)
      - AI_PROVIDER=${AI_PROVIDER:-cloudflare}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - CF_WORKER_AI_TOKEN=${CF_WORKER_AI_TOKEN:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_DEFAULT_MODEL=${GROQ_DEFAULT_MODEL:-openai/gpt-oss-20b}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

      # Authentication & RBAC
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_DEFAULT_ADMIN_USERNAME=${AUTH_DEFAULT_ADMIN_USERNAME:-admin}
      - AUTH_DEFAULT_ADMIN_PASSWORD=${AUTH_DEFAULT_ADMIN_PASSWORD:-KamalAdmin2026!}
      - AUTH_DEFAULT_STAFF_USERNAME=${AUTH_DEFAULT_STAFF_USERNAME:-staff}
      - AUTH_DEFAULT_STAFF_PASSWORD=${AUTH_DEFAULT_STAFF_PASSWORD:-KamalStaff2026!}
      - AUTH_SESSION_EXPIRE_DAYS=${AUTH_SESSION_EXPIRE_DAYS:-7}
      - AUTH_WEBHOOK_SECRET=${AUTH_WEBHOOK_SECRET:-}

      # Captcha Solving
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-none}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY:-}

      # Browser Automation
      - BROWSER_MODE=local
      - BROWSER_HEADLESS=true
      - BROWSER_TIMEOUT_MS=30000

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
      - kamal_data:/app/data
      - browser_profiles:/app/browser_profiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kamal-net

volumes:
  kamal_data:
  browser_profiles:

networks:
  kamal-net:
    driver: bridge
