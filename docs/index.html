<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamal Express Knowledge Hub</title>

  <!-- Google OSS Fonts: Plus Jakarta Sans (Prose) & JetBrains Mono (Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with Typography plugin & Dark mode class configuration -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons Pack -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Offline Local Syntax Highlighting (Highlight.js) -->
  <link id="hljs-theme-dark" rel="stylesheet" href="assets/highlight-dark.min.css">
  <link id="hljs-theme-light" rel="stylesheet" href="assets/highlight-light.min.css" disabled>

  <style>
    /* Custom scrollbars & smooth transitions */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    /* Enhanced Code Block Container */
    .code-block-wrapper {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0 24px 0;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .light .code-block-wrapper {
      border-color: #e2e8f0;
      box-shadow: 0 2px 4px 0 rgb(0 0 0 / 0.05);
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      font-size: 11px;
      font-family: "JetBrains Mono", monospace;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .light .code-block-header {
      background: #f1f5f9;
      border-bottom-color: #e2e8f0;
      color: #64748b;
    }

    .code-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #334155;
      color: #cbd5e1;
      transition: all 0.15s ease;
    }
    .light .code-copy-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #475569;
    }
    .code-copy-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .light .code-copy-btn:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .code-block-wrapper pre {
      margin: 0 !important;
      border-radius: 0 !important;
      padding: 16px 18px !important;
      background: #050811 !important;
      border: none !important;
      overflow-x: auto;
    }
    .light .code-block-wrapper pre {
      background: #f8fafc !important;
    }

    .code-block-wrapper code {
      font-family: "JetBrains Mono", ui-monospace, monospace !important;
      font-size: 12.5px !important;
      line-height: 1.65 !important;
      background: transparent !important;
      padding: 0 !important;
      border: none !important;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 h-screen flex overflow-hidden antialiased selection:bg-blue-500/20 selection:text-blue-600 dark:selection:text-blue-400">

  <!-- Left Sidebar (Navigation & Search) -->
  <aside id="sidebar" class="w-80 min-w-[320px] h-screen bg-white dark:bg-[#0f172a] border-r border-slate-200 dark:border-slate-800/80 flex flex-col z-30 transition-transform duration-200 ease-out md:translate-x-0 -translate-x-full fixed md:static shadow-sm">
    
    <!-- Brand Header -->
    <div class="h-16 px-5 border-b border-slate-200 dark:border-slate-800/80 flex items-center justify-between">
      <a href="javascript:renderHomePage()" class="flex items-center gap-3 group">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shadow-sm shadow-blue-500/20 group-hover:bg-blue-700 transition-colors">
          <i data-lucide="book-marked" class="w-4 h-4"></i>
        </div>
        <div>
          <span class="font-bold text-sm tracking-tight text-slate-900 dark:text-white block leading-tight">Kamal Express</span>
          <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400 block leading-tight">Knowledge Base Hub</span>
        </div>
      </a>
      <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-50 text-blue-700 dark:bg-blue-950/60 dark:text-blue-300 border border-blue-200 dark:border-blue-800">
        v0.2.0
      </span>
    </div>

    <!-- Search Input Bar -->
    <div class="p-3 border-b border-slate-200 dark:border-slate-800/80">
      <div class="relative flex items-center">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search docs (Ctrl + K)..." 
          class="w-full pl-9 pr-14 py-2 bg-slate-100 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/60 rounded-lg text-xs font-medium text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all"
        />
        <div class="absolute right-2.5 flex items-center gap-1">
          <kbd class="px-1.5 py-0.5 text-[10px] font-mono text-slate-400 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded shadow-2xs">Ctrl K</kbd>
        </div>
      </div>
    </div>

    <!-- Categories & Docs Tree -->
    <nav class="flex-1 overflow-y-auto p-3 space-y-4" id="nav-tree">
      <!-- Injected dynamically -->
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-slate-200 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-900/40">
      <span class="flex items-center gap-1.5 font-medium text-[11.5px]">
        <i data-lucide="hard-drive" class="w-3.5 h-3.5 text-slate-400"></i>
        Offline Verified
      </span>
      <span id="doc-count-badge" class="px-2 py-0.5 text-[10.5px] font-semibold rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
        36 Docs
      </span>
    </div>
  </aside>

  <!-- Main Content Layout -->
  <main class="flex-1 h-screen flex flex-col overflow-hidden bg-slate-50 dark:bg-[#090d16]">
    
    <!-- Topbar Navigation & Theme Controls -->
    <header class="h-16 min-h-[64px] px-6 bg-white dark:bg-[#0f172a] border-b border-slate-200 dark:border-slate-800/80 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-3">
        <!-- Mobile Sidebar Hamburger -->
        <button id="mobile-toggle" class="md:hidden p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <!-- Breadcrumb trail -->
        <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 font-medium" id="breadcrumb">
          <span>Documentation</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300 dark:text-slate-600"></i>
          <span class="text-slate-900 dark:text-white font-semibold">Knowledge Hub</span>
        </div>
      </div>

      <!-- Action Buttons & Theme Switcher -->
      <div class="flex items-center gap-2.5">
        <!-- Light / Dark Mode Toggle (Shadcn Style) -->
        <button id="theme-toggle" class="p-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-lg transition-colors" title="Toggle theme">
          <i id="theme-icon-sun" data-lucide="sun" class="w-4 h-4 hidden"></i>
          <i id="theme-icon-moon" data-lucide="moon" class="w-4 h-4 hidden"></i>
        </button>

        <!-- Copy Raw Markdown Button -->
        <button id="btn-copy-md" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition-colors" title="Copy raw markdown to clipboard">
          <i data-lucide="copy" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Copy MD</span>
        </button>
      </div>
    </header>

    <!-- Reading Content Area -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- Article Scroll Container -->
      <div class="flex-1 overflow-y-auto px-6 md:px-12 py-8" id="doc-scroll">
        <div class="max-w-4xl mx-auto">
          
          <!-- Document Header & Meta Pill Tags -->
          <div class="pb-6 mb-8 border-b border-slate-200 dark:border-slate-800/80">
            <h1 id="doc-title" class="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-3">
              Knowledge Base Hub
            </h1>
            <div class="flex flex-wrap items-center gap-2.5 text-xs">
              <span id="doc-category" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800">
                Hub
              </span>
              <span id="doc-path" class="font-mono text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-700 text-[11.5px]">
                docs/index.html
              </span>
              <span id="doc-reading-time" class="text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-700">
                0 min read
              </span>
            </div>
          </div>

          <!-- Markdown Content Pane with Tailwind Typography -->
          <article class="prose prose-slate dark:prose-invert max-w-none text-slate-700 dark:text-slate-300 font-sans prose-headings:font-bold prose-headings:tracking-tight prose-h1:text-2xl prose-h2:text-xl prose-h2:border-b prose-h2:border-slate-200 dark:prose-h2:border-slate-800 prose-h2:pb-2 prose-code:font-mono prose-code:text-blue-600 dark:prose-code:text-blue-400 prose-code:bg-slate-100 dark:prose-code:bg-slate-800 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:text-xs prose-table:border prose-table:border-slate-200 dark:prose-table:border-slate-800 prose-th:bg-slate-100 dark:prose-th:bg-slate-800/80 prose-th:px-3 prose-th:py-2.5 prose-td:px-3 prose-td:py-2" id="doc-content">
            <!-- Injected dynamically -->
          </article>
        </div>
      </div>

      <!-- Right "On This Page" Table of Contents -->
      <aside id="toc-rail" class="w-64 min-w-[256px] border-l border-slate-200 dark:border-slate-800/80 bg-white dark:bg-[#0f172a] p-6 overflow-y-auto hidden xl:block">
        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3 flex items-center gap-1.5">
          <i data-lucide="align-left" class="w-3.5 h-3.5"></i>
          On This Page
        </div>
        <div id="toc-list" class="space-y-1 text-xs">
          <!-- Dynamic Headings Injected Here -->
        </div>
      </aside>
    </div>
  </main>

  <!-- Offline Local Markdown Parser & Syntax Highlighter -->
  <script src="assets/marked.min.js"></script>
  <script src="assets/highlight.min.js"></script>
  <script src="docs_data.js"></script>

  <script>
    // State
    let currentDocId = "home";
    const docs = window.DOCS_DATA || [];

    // Configure marked with highlight.js integration
    if (window.marked && window.hljs) {
      marked.setOptions({
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
            } catch (__) {}
          }
          try {
            return hljs.highlightAuto(code).value;
          } catch (__) {}
          return code;
        },
        langPrefix: 'hljs language-'
      });
    }

    // Icon map
    const ICONS = {
      overview: 'book-open',
      architecture: 'layers',
      adr: 'shield-check',
      workers: 'zap',
      handoffs: 'history',
      lessons: 'alert-triangle',
      standards: 'check-circle-2',
      glossary: 'file-text',
      indexes: 'list-ordered',
      operations: 'terminal',
      sprint: 'calendar-check',
      'skills system': 'cpu',
      'skills-system': 'cpu',
      general: 'file'
    };

    // Theme Management (Light / Dark)
    function initTheme() {
      const savedTheme = localStorage.getItem("docs-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (prefersDark ? "dark" : "light");
      setTheme(theme);

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const isDark = document.documentElement.classList.contains("dark");
        setTheme(isDark ? "light" : "dark");
      });
    }

    function setTheme(theme) {
      const sunIcon = document.getElementById("theme-icon-sun");
      const moonIcon = document.getElementById("theme-icon-moon");
      const darkCss = document.getElementById("hljs-theme-dark");
      const lightCss = document.getElementById("hljs-theme-light");

      if (theme === "dark") {
        document.documentElement.classList.add("dark");
        document.documentElement.classList.remove("light");
        sunIcon.classList.remove("hidden");
        moonIcon.classList.add("hidden");
        if (darkCss) darkCss.disabled = false;
        if (lightCss) lightCss.disabled = true;
      } else {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        sunIcon.classList.add("hidden");
        moonIcon.classList.remove("hidden");
        if (darkCss) darkCss.disabled = true;
        if (lightCss) lightCss.disabled = false;
      }
      localStorage.setItem("docs-theme", theme);
      if (window.lucide) lucide.createIcons();
    }

    // App Initialization
    function init() {
      initTheme();
      document.getElementById("doc-count-badge").textContent = `${docs.length} Docs`;
      buildSidebar();
      setupSearch();
      setupShortcuts();
      setupMobileToggle();

      // Check URL hash for direct deep links
      const hash = window.location.hash.replace("#", "");
      if (hash && docs.some(d => d.id === hash)) {
        loadDoc(hash);
      } else {
        renderHomePage();
      }

      if (window.lucide) lucide.createIcons();
    }

    // Build categories and navigation tree
    function buildSidebar(filterText = "") {
      const nav = document.getElementById("nav-tree");
      nav.innerHTML = "";

      // Overview Link
      const homeLink = document.createElement("a");
      homeLink.className = `flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-semibold transition-colors cursor-pointer ${
        currentDocId === 'home'
          ? 'bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 font-bold border-l-2 border-blue-600'
          : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white'
      }`;
      homeLink.innerHTML = `<i data-lucide="home" class="w-4 h-4"></i> <span>Overview &amp; Knowledge Map</span>`;
      homeLink.onclick = () => { renderHomePage(); closeMobileSidebar(); };
      nav.appendChild(homeLink);

      // Group docs by category
      const categories = {};
      docs.forEach(doc => {
        if (filterText) {
          const match = doc.title.toLowerCase().includes(filterText) ||
                        doc.description.toLowerCase().includes(filterText) ||
                        doc.path.toLowerCase().includes(filterText) ||
                        doc.markdown.toLowerCase().includes(filterText);
          if (!match) return;
        }

        const cat = doc.category || "General";
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(doc);
      });

      const priorityOrder = [
        "Overview", "Architecture", "Adr", "Workers", "Handoffs",
        "Lessons", "Standards", "Glossary", "Indexes", "Operations", "Sprint", "Skills System", "General"
      ];

      const sortedCategories = Object.keys(categories).sort((a, b) => {
        const ia = priorityOrder.indexOf(a);
        const ib = priorityOrder.indexOf(b);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ia !== -1) return 1;
        return a.localeCompare(b);
      });

      sortedCategories.forEach(catName => {
        const catDocs = categories[catName];
        const catBox = document.createElement("div");
        catBox.className = "space-y-1";

        const catHeader = document.createElement("div");
        catHeader.className = "px-3 pt-2 text-[10.5px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center justify-between";
        catHeader.innerHTML = `<span>${catName}</span><span class="text-[9.5px] px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500">${catDocs.length}</span>`;
        catBox.appendChild(catHeader);

        catDocs.forEach(doc => {
          const item = document.createElement("a");
          const isActive = currentDocId === doc.id;
          item.className = `flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors cursor-pointer ${
            isActive
              ? 'bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 font-bold border-l-2 border-blue-600'
              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white'
          }`;
          const iconName = ICONS[catName.toLowerCase()] || ICONS.general;
          item.innerHTML = `<i data-lucide="${iconName}" class="w-3.5 h-3.5 opacity-70 flex-shrink-0"></i> <span class="truncate">${escapeHtml(doc.title)}</span>`;
          item.onclick = () => { loadDoc(doc.id); closeMobileSidebar(); };
          catBox.appendChild(item);
        });

        nav.appendChild(catBox);
      });

      if (window.lucide) lucide.createIcons();
    }

    // Search filter setup
    function setupSearch() {
      const input = document.getElementById("search-input");
      input.addEventListener("input", (e) => {
        const val = e.target.value.trim().toLowerCase();
        buildSidebar(val);
      });
    }

    // Keyboard Shortcuts (Ctrl + K / Escape)
    function setupShortcuts() {
      window.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "k") {
          e.preventDefault();
          document.getElementById("search-input").focus();
        } else if (e.key === "Escape") {
          const input = document.getElementById("search-input");
          if (document.activeElement === input) {
            input.value = "";
            buildSidebar();
            input.blur();
          }
        }
      });
    }

    // Mobile drawer
    function setupMobileToggle() {
      const btn = document.getElementById("mobile-toggle");
      const sidebar = document.getElementById("sidebar");
      btn.addEventListener("click", () => {
        sidebar.classList.toggle("-translate-x-full");
      });
    }

    function closeMobileSidebar() {
      document.getElementById("sidebar").classList.add("-translate-x-full");
    }

    // Render Home / Topic Map View
    function renderHomePage() {
      currentDocId = "home";
      window.location.hash = "home";
      buildSidebar();

      document.getElementById("doc-title").textContent = "Kamal Express Knowledge Hub";
      document.getElementById("doc-category").textContent = "Hub";
      document.getElementById("doc-path").textContent = "docs/index.html";
      document.getElementById("doc-reading-time").textContent = `${docs.length} Documents`;
      document.getElementById("breadcrumb").innerHTML = `<span>Documentation</span> <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400"></i> <span class="text-slate-900 dark:text-white font-semibold">Knowledge Hub</span>`;
      document.getElementById("toc-list").innerHTML = "";

      const content = document.getElementById("doc-content");
      content.innerHTML = `
        <p class="text-sm md:text-base text-slate-600 dark:text-slate-300 leading-relaxed mb-6">
          Welcome to the unified technical documentation and AI knowledge base for the <strong>Kamal Express AI Platform</strong>.
          This hub provides immediate offline architectural guidance, standalone worker parameters, incident playbooks, and historical handoffs.
        </p>

        <h2 class="text-lg font-bold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-2 mb-4">Core Knowledge Domains</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
          
          <div class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 shadow-2xs hover:shadow-md hover:border-blue-500/50 transition-all cursor-pointer flex flex-col justify-between group" onclick="loadDoc('standalone-workers-workflow-specification')">
            <div>
              <div class="w-9 h-9 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-3 group-hover:scale-105 transition-transform">
                <i data-lucide="zap" class="w-5 h-5"></i>
              </div>
              <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-1">Standalone Workers (Scout &amp; Booker)</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                Comprehensive CLI guide for <code>checker.py</code> and <code>booker.py</code>, parameter schemas, sequence diagrams, and comparative human vs automated workflow tables.
              </p>
            </div>
            <div class="mt-3 text-xs font-semibold text-blue-600 dark:text-blue-400 flex items-center gap-1">
              Read specification <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </div>
          </div>

          <div class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 shadow-2xs hover:shadow-md hover:border-blue-500/50 transition-all cursor-pointer flex flex-col justify-between group" onclick="loadDoc('08-failproof-autonomous-workers-specification')">

    // Load and render a specific document
    function loadDoc(docId) {
      let doc = docs.find(d => d.id === docId);
      if (!doc && docId === 'readme') {
        doc = docs.find(d => d.id === 'project-overview' || d.id === 'master-index');
      }
      if (!doc) return;

      currentDocId = doc.id;
      window.location.hash = doc.id;
      buildSidebar();

      document.getElementById("doc-title").textContent = doc.title;
      document.getElementById("doc-category").textContent = doc.category;
      document.getElementById("doc-path").textContent = doc.path;

      // Estimate reading time
      const wordCount = doc.markdown.trim().split(/\s+/).length;
      const readMins = Math.max(1, Math.round(wordCount / 200));
      document.getElementById("doc-reading-time").textContent = `${readMins} min read (${doc.line_count} lines)`;

      document.getElementById("breadcrumb").innerHTML = `
        <span>Documentation</span> 
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400"></i> 
        <span>${escapeHtml(doc.category)}</span> 
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400"></i> 
        <span class="text-slate-900 dark:text-white font-semibold">${escapeHtml(doc.title)}</span>
      `;

      // Convert Markdown to HTML using marked.js with highlight.js formatting
      const rawHtml = marked.parse(doc.markdown);
      const contentEl = document.getElementById("doc-content");
      contentEl.innerHTML = rawHtml;

      // Wrap pre blocks into beautiful code block containers with language header & copy button
      enhanceCodeBlocks(contentEl);

      // Extract Headings for Table of Contents
      buildToc(contentEl);

      // Scroll to top
      document.getElementById("doc-scroll").scrollTop = 0;

      if (window.lucide) lucide.createIcons();
    }

    // Enhance Code Blocks with Language Header & Copy Action
    function enhanceCodeBlocks(container) {
      const preElements = container.querySelectorAll("pre");
      preElements.forEach(pre => {
        const code = pre.querySelector("code");
        if (!code) return;

        // Detect language from class (e.g. language-python, language-powershell)
        let langName = "CODE";
        code.classList.forEach(cls => {
          if (cls.startsWith("language-")) {
            langName = cls.replace("language-", "").toUpperCase();
          } else if (cls.startsWith("hljs")) {
            const m = cls.match(/language-([a-zA-Z0-9_-]+)/);
            if (m) langName = m[1].toUpperCase();
          }
        });

        // Wrapper container
        const wrapper = document.createElement("div");
        wrapper.className = "code-block-wrapper";

        // Header bar
        const header = document.createElement("div");
        header.className = "code-block-header";
        header.innerHTML = `
          <span class="code-lang-badge">${langName}</span>
          <button class="code-copy-btn">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>Copy</span>
          </button>
        `;

        const copyBtn = header.querySelector(".code-copy-btn");
        copyBtn.onclick = () => {
          const textToCopy = code.innerText;
          navigator.clipboard.writeText(textToCopy).then(() => {
            copyBtn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> <span class="text-emerald-400">Copied!</span>`;
            if (window.lucide) lucide.createIcons();
            setTimeout(() => {
              copyBtn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Copy</span>`;
              if (window.lucide) lucide.createIcons();
            }, 2000);
          });
        };

        // Replace pre with wrapped element
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      });
    }

    // Build right-hand TOC rail
    function buildToc(contentEl) {
      const tocList = document.getElementById("toc-list");
      tocList.innerHTML = "";

      const headings = contentEl.querySelectorAll("h2, h3");
      if (headings.length === 0) {
        document.getElementById("toc-rail").style.display = "none";
        return;
      }
      document.getElementById("toc-rail").style.display = "block";

      headings.forEach((heading, idx) => {
        const id = "sec-" + idx + "-" + heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        heading.id = id;

        const link = document.createElement("a");
        const isH3 = heading.tagName.toLowerCase() === "h3";
        link.className = `block text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors truncate py-1 ${isH3 ? 'pl-4 text-[11.5px]' : 'font-medium text-xs'}`;
        link.textContent = heading.textContent;
        link.href = "#" + id;
        link.onclick = (e) => {
          e.preventDefault();
          heading.scrollIntoView({ behavior: "smooth" });
        };
        tocList.appendChild(link);
      });
    }

    // Copy raw markdown button in topbar
    document.getElementById("btn-copy-md").onclick = () => {
      const doc = docs.find(d => d.id === currentDocId);
      if (doc) {
        navigator.clipboard.writeText(doc.markdown).then(() => {
          alert("[SUCCESS] Full Markdown copied to clipboard!");
        });
      } else {
        alert("[INFO] Please select a document to copy.");
      }
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Launch App
    window.addEventListener("DOMContentLoaded", init);
  </script>
